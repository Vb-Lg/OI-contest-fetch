name: Update Contests & Commit

on:
  schedule:
    - cron: '7/15 * * * *'   # 每 15 分钟执行一次，避开整点高峰
  push:
    branches:
      - master
  workflow_dispatch:          # 允许手动触发

# 避免定时触发与 push 触发同时运行时互相覆盖
concurrency:
  group: update-contests
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # 允许 Actions 推送代码

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1      # 只需要最新一次提交，加速
          ref: master         # 明确在 master 上操作

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'        # 自动缓存 pip 下载缓存

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch contests
        run: python fetch_contests.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contests_all.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update contest data [skip ci]"
            git push
          fi
